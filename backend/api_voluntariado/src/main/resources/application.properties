spring.application.name=api_voluntariado
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Base de datos (desarrollo): H2 guardada en archivo (./data), asi los datos
# sobreviven a los reinicios. En produccion usar el perfil "prod" (PostgreSQL),
# ver application-prod.properties.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/voluntariadodb;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Seguridad (JWT). El secreto debe tener al menos 32 caracteres y DEBE
# cambiarse en produccion con la variable de entorno JWT_SECRET.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:cambia-este-secreto-de-desarrollo-por-uno-largo-y-seguro}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:480}

# Usuario administrador creado al primer arranque (si no existe ninguno)
app.admin.email=${ADMIN_EMAIL:admin@hablemosconlasmanos.org}
app.admin.password=${ADMIN_PASSWORD:Admin12345}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}

# Carga de datos de ejemplo (programas, paises, proyectos, noticias...) si la BD esta vacia
app.datos-ejemplo=${DATOS_EJEMPLO:true}

# ---------------------------------------------------------------------------
# CORS: origenes del frontend
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------------------------------------------------------------------------
# Archivos subidos (CV de postulantes, imagenes de noticias/proyectos)
# ---------------------------------------------------------------------------
app.archivos.directorio=${UPLOADS_DIR:./uploads}
app.archivos.url-publica=${UPLOADS_URL:http://localhost:8080/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------------------------------------------------------------------------
# Correo. Si app.correo.habilitado=false los correos solo se registran en el log.
# ---------------------------------------------------------------------------
app.correo.habilitado=${CORREO_HABILITADO:false}
app.correo.remitente=${CORREO_REMITENTE:no-responder@hablemosconlasmanos.org}
app.correo.notificaciones=${CORREO_NOTIFICACIONES:contacto@hablemosconlasmanos.org}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------------
# Donaciones: URL del frontend a la que vuelve el donante y secreto compartido
# con la pasarela de pago para validar las notificaciones (webhook).
# ---------------------------------------------------------------------------
app.donaciones.url-retorno=${DONACION_URL_RETORNO:http://localhost:5173/donar/gracias}
app.donaciones.webhook-secret=${DONACION_WEBHOOK_SECRET:secreto-webhook-desarrollo}
app.newsletter.url-baja=${NEWSLETTER_URL_BAJA:http://localhost:5173/newsletter/baja}

# Los campos booleanos omitidos en el JSON (ej. "anonima") se toman como false
spring.jackson.deserialization.fail-on-null-for-primitives=false
