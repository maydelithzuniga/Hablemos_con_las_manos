# Levanta todo el proyecto: base de datos -> backend -> frontend
#   docker compose up -d --build
#
#   Frontend: http://localhost:3000
#   API:      http://localhost:8080
#
# En un servidor remoto, crea un archivo .env junto a este con la IP o dominio
# con el que se entra desde el navegador, por ejemplo:
#   PUBLIC_HOST=54.12.34.56
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: voluntariado
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voluntariado"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend/api_voluntariado
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/voluntariado
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATOS_EJEMPLO: "true"
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-de-desarrollo-por-uno-largo-y-seguro}
      CORS_ALLOWED_ORIGINS: http://${PUBLIC_HOST:-localhost}:3000
      UPLOADS_URL: http://${PUBLIC_HOST:-localhost}:8080/uploads
      DONACION_URL_RETORNO: http://${PUBLIC_HOST:-localhost}:3000/donar/gracias
      NEWSLETTER_URL_BAJA: http://${PUBLIC_HOST:-localhost}:3000/newsletter/baja
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/impacto > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # La usa el navegador, por eso apunta al puerto publicado del backend
        VITE_API_URL: http://${PUBLIC_HOST:-localhost}:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
  uploads:
